name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run unit tests with branch coverage
        run: |
          python -m coverage run -m unittest discover -v
          python -m coverage report

      - name: Smoke-test GUI startup
        if: runner.os == 'Linux'
        run: xvfb-run -a python -c "from proxy_tester.gui import ProxyTesterGui; app = ProxyTesterGui(); app.update_idletasks(); app.destroy()"
